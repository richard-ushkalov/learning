<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>day3</title>
        <style>
            * {
                box-sizing: border-box;
            }

            .boxes {
                position: relative;
                background-color: aqua;
                /* overflow: hidden; not working with this types of... (then `fixed` better) */
                width: 3000px;
                height: 3000px;
                border: 1px solid black;
            }
            .box {
                position: sticky;
                top: -20px;
                width: 25px;
                height: 25px;
                margin-top: -5px;
                border: 1px solid blue;
            }

            .box-a {
                left: 25px;
                z-index: -1;
            }
            .box-b {
                left: 50px;
            }
            .box-c {
                width: 25px;
                height: 25px;
                border: 1px solid red;
            }
        </style>
    </head>
    <body>
        <div class="boxes">
            <div class="box box-a">A</div>
            <div class="box box-b">B</div>
            <div class="box-c">C</div>
        </div>
    </body>
</html>
