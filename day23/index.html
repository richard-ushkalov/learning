<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>День 23</title>

        <script src="app.js" type="module"></script>
    </head>
    <body>
        <main>
            <h1>Поиск треков</h1>

            <search class="search">
                <label for="tracks">Введите название трека
                    <input id="tracks" class="search__input" type="search" name="tracks-search">
                </label>

                <p class="search__status" role="status"></p>

                <ul class="search__list"></ul>
            </search>

            <section class="starting-block">
                <h2 class="starting-block__title">Для начала</h2>
                <div class="starting-block__shelves"></div>
            </section>

            <template class="track-template">
                <li class="track">
                    <img class="track__artwork" width="100" height="100" loading="lazy" alt="">
                    <p class="track__title"></p>
                    <p class="track__artist"></p>
                </li>
            </template>

            <template class="shelf-template">
                <section class="shelf">
                    <h3 class="shelf__title"></h3>
                    <p class="shelf__status" role="status"></p>
                    <ul class="shelf__list"></ul>
                </section>
            </template>
        </main>
    </body>
</html>
