<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>homework3</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: Arial;
                /* color: black;
                text-align: center; */
            }
            button, input, select, textarea {
                font: inherit;
            }
            img {
                display: block;
                max-width: 100%;
            }
            
            .header {
                position: sticky;
                top: 0px;
                display: flex;
                align-items: center;
                height: 60px;
                gap: 10px;
                padding: 5px;
                border: 1px solid black;
                background-color: white;
                z-index: 10;
            }
            .navigation {
                display: flex;
                gap: 10px;
            }
            .navigation a {
                color: black;
            }
            .search {
                flex-grow: 1;
                min-width: 0;
            }
            .avatar {
                border-radius: 50%;
            }

            .logo, .avatar {
                max-height: 100%;
                flex-shrink: 0;
            }

            .cards {
                display: flex;
                flex-direction: column;
                padding-top: 10px;
                gap: 10px;
                align-items: center;
            }
            .card {
                position: relative;
                background-color: white;
                width: 300px;
                height: 300px;
                border: 1px solid gray;
            }
            .sale {
                position: absolute;
                top: 8px;
                right: 8px;
                padding: 4px 8px;
                background-color: red;
            }

            .button-up {
                position: fixed;
                bottom: 10px;
                right: 10px;
                z-index: 1;
            }

            .modal {
                position: fixed;
                display: flex;
                align-items: center;
                justify-content: center;
                inset: 0;
                z-index: 100;
                background-color: rgba(0, 0, 0, 0.25);
            }
            .dialog {
                background-color: white;
                padding: 25px;
                text-align: center;
            }
            .answers {
                display: flex;
                gap: 10px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <img class="logo" src="html_logo.png" alt="Logo" />
            <nav class="navigation">
                <a href="main.html">Главная</a>
                <a href="about.html">О нас</a>
                <a href="blog.html">Блог</a>
            </nav>
            <input class="search" type="search" placeholder="Поиск" />
            <img class="avatar" src="rchrd.jpeg" alt="Avatar" />
        </div>

        <div class="cards">
            <div class="card">
                <span class="sale">SALE</span>
            </div>
            <div class="card">
                <span class="sale">SALE</span>
            </div>
            <div class="card">
                <span class="sale">SALE</span>
            </div>
            <div class="card">
                <span class="sale">SALE</span>
            </div>
            <div class="card">
                <span class="sale">SALE</span>
            </div>
            <div class="card">
                <span class="sale">SALE</span>
            </div>
        </div>

        <button class="button-up">Наверх</button>

        <div class="modal">
            <div class="dialog">
                <h2>Мы используем cookies</h2>
                <div class="answers">
                    <button>Разрешить</button>
                    <button>Только необходимые</button>
                    <button>Запретить</button>
                </div> 
            </div>
        </div>
    </body>
</html>
