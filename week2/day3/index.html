<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Homework</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form class="form" action="" method="get">
            <!-- name, email, phone number -->
            <fieldset class="group">
                <legend class="group__legend">
                    Введите Ваши данные
                </legend>

                <div class="group__body">
                    <label class="group__label">
                        Имя
                        <input class="group__text" type="text" name="first-name" required>
                    </label>

                    <label class="group__label">
                        Фамилия
                        <input class="group__text" type="text" name="second-name" required>
                    </label>

                    <label class="group__label">
                        E-mail
                        <input class="group__text" type="email" autocomplete="email" name="email" required>
                    </label>

                    <label class="group__label">
                        Номер телефона
                        <input class="group__text" type="tel" name="phone-number" autocomplete="tel">
                    </label>
                </div>
            </fieldset>

            <!-- block `format`: online, in studio, hybrid -->
            <fieldset class="group">
                <legend class="group__legend">
                    Формат занятий
                </legend>

                <div class="group__body">
                    <label class="group__label">
                        Онлайн
                        <input class="group__radio" type="radio" name="class-format" value="online" required>
                    </label>

                    <label class="group__label">
                        В студии
                        <input class="group__radio" type="radio" name="class-format" value="in-studio">
                    </label>

                    <label class="group__label">
                        Гибрид
                        <input class="group__radio" type="radio" name="class-format" value="hybrid">
                    </label>  
                </div>
         
            </fieldset>

            <!-- block `areas of interest`: billiard, golf, tennis, ping-pong -->
            <fieldset class="group">
                <legend class="group__legend">
                    Интересующие направления
                </legend>

                <div class="group__body">
                    <label class="group__label">
                        Бильярд
                        <input class="group__checkbox" type="checkbox" name="area-of-interest[]" value="billiard">
                    </label>

                    <label class="group__label">
                        Гольф
                        <input class="group__checkbox" type="checkbox" name="area-of-interest[]" value="golf">
                    </label>

                    <label class="group__label">
                        Теннис
                        <input class="group__checkbox" type="checkbox" name="area-of-interest[]" value="tennis">
                    </label>

                    <label class="group__label">
                        Пинг-понг
                        <input class="group__checkbox" type="checkbox" name="area-of-interest[]" value="ping-pong">
                    </label>
                </div>
            </fieldset>

            <!-- block `promo`: exacly 8 symbols, letters and numbers -->
            <div class="line__body">
                <label class="line__label">
                    Промокод
                    <input class="line__text text--uppercase" type="text" name="promo" pattern="[a-zA-Z0-9]{8}" maxlength="8"
                    title="Только символы и цифры, всего 8 символов">
                </label>
            </div>

            <!-- block `comment`: min 30 symbols (not necessary) -->
            <div class="line__body">
                <label class="line__label">
                    Комментарий
                    <textarea class="line__comment" name="comment" rows="4" minlength="30"></textarea>
                </label>
            </div>

            <!-- checkbox `agreement` -->
            <div class="line__body">
                <label class="line__label">
                    Согласен(-на) на обработку персональных данных
                    <input class="line__checkbox" type="checkbox" name="agreement" value="agree" required>
                </label>
            </div>

            <!-- 2 buttons: sign up, clear the form -->
            <div class="form__actions">
                <button class="button button--agree" type="submit">Записаться</button>
                <button class="button button--disagree" type="reset">Очистить форму</button>
            </div>
        </form>
    </body>
</html>
