<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Homework</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form index="" get="get">
            <!-- name, email, phone number -->
            <fieldset class="group">
                <legend class="group-legend">
                    Введите Ваши данные
                </legend>

                <label>
                    Имя
                    <input type="text" name="first-name" required>
                </label>

                <label>
                    Фамилия
                    <input type="text" name="second-name" required>
                </label>

                <label>
                    E-mail
                    <input inputmode="email" type="email" autocomplete="email" name="email" required>
                </label>

                <label>
                    Номер телефона
                    <input inputmode="numeric" type="text" name="phone-number" pattern="[0-9]+" required>
                </label>
            </fieldset>

            <!-- block `format`: online, in studio, hybrid -->
            <fieldset class="group">
                <legend class="group-legend">
                    Формат занятий
                </legend>

                <label>
                    Онлайн
                    <input type="radio" name="class-format" value="online" required>
                </label>

                <label>
                    В студии
                    <input type="radio" name="class-format" value="in-studio">
                </label>

                <label>
                    Гибрид
                    <input type="radio" name="class-format" value="hybrid">
                </label>
            </fieldset>

            <!-- block `areas of interest`: billiard, golf, tennis, ping-pong -->
            <fieldset class="group">
                <legend class="group-legend">
                    Интересующие направления
                </legend>

                <label>
                    Бильярд
                    <input type="checkbox" name="area-of-interest" value="billiard">
                </label>

                <label>
                    Гольф
                    <input type="checkbox" name="area-of-interest" value="golf">
                </label>

                <label>
                    Теннис
                    <input type="checkbox" name="area-of-interest" value="tennis">
                </label>

                <label>
                    Пинг-понг
                    <input type="checkbox" name="area-of-interest" value="ping-pong">
                </label>
            </fieldset>

            <!-- block `promo`: exacly 8 symbols, letters and numbers -->
            <label>
                Промокод
                <input type="text" name="promo" minlength="8" maxlength="8">
            </label>

            <!-- block `comment`: min 30 symbols (not necessary) -->
            <label>
                Комментарий
                <input type="text" name="comment" minlength="30">
            </label>

            <!-- checkbox `agreement` -->
            <fieldset class="group">
                <legend class="group-legend">
                    Вы согласны на обработку персональных данных?
                </legend>

                <label>
                    Согласен(-на) на обработку персональных данных
                    <input type="checkbox" name="agreement" value="agree">
                </label>
            </fieldset>

            <!-- 2 buttons: sign up, clear the form -->
            <div class="form__actions">
                <button type="submit">Записаться</button>
                <button type="button">Очистить форму</button>
            </div>
        </form>
    </body>
</html>
