<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>8ball Intro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="layout">
            <div class="hero-layout">
                <header class="header">
                    <div class="header__title">
                        <h1 class="header__text header__text--bold">8</h1>
                        <h1 class="header__text header__text--medium">ball</h1>
                        <h1 class="header__text header__text--light header__text--italic header__text--space">pool</h1>
                    </div>
                    <span class="header__divider"></span>
                    <div class="header__description">
                        <p class="header__text">have a good time — drink some bear & fill hole’s with eight’s</p>
                    </div>
                </header>

                <div class="photo-frame">
                    <div class="photo-frame__layout">
                        <img class="photo-frame__hero-image" width="5332" height="3848" src="images/table-wide.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
