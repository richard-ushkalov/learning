<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>8Ball by rchrd</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="layout">
            <main class="main">
                <div class="table">
                    <div class="table__frames table__layer">
                        <div class="table__frame table__frame-top"></div>
                        <div class="table__frames-center">
                            <div class="table__frame table__frame-left"></div>
                            <div class="table__frame table__frame-right"></div>
                        </div>
                        <div class="table__frame table__frame-bottom"></div>
                    </div>
                    <div class="table__corners table__layer">
                        <div class="table__corner table__corner--top-left"></div>
                        <div class="table__corner table__corner--top-center"></div>
                        <div class="table__corner table__corner--top-right"></div>
                        <div class="table__corner table__corner--bottom-left"></div>
                        <div class="table__corner table__corner--bottom-center"></div>
                        <div class="table__corner table__corner--bottom-right"></div>
                    </div>
                    <div class="table__cloth table__layer"></div>
                    <div class="table__holes table__layer">
                        <div class="table__hole table__hole--top-left"></div>
                        <div class="table__hole table__hole--top-center"></div>
                        <div class="table__hole table__hole--top-right"></div>
                        <div class="table__hole table__hole--bottom-left"></div>
                        <div class="table__hole table__hole--bottom-center"></div>
                        <div class="table__hole table__hole--bottom-right"></div>
                    </div>
                    <div class="table__bumps table__layer">
                        <div class="table__bump table__bump--top-left"></div>
                        <div class="table__bump table__bump--top-right"></div>
                        <div class="table__bump table__bump--center-left"></div>
                        <div class="table__bump table__bump--center-right"></div>
                        <div class="table__bump table__bump--bottom-left"></div>
                        <div class="table__bump table__bump--bottom-right"></div>
                    </div>
                    <div class="table__playing-zone table__layer">
                        <div class="ball ball--eight">
                            <div class="ball__inside-frame">
                                <p class="ball__value">8</p>
                            </div>
                        </div>
                        <div class="ball ball--cue">
                        </div>
                        <div class="ball ball--one">
                            <div class="ball__inside-frame">
                                <p class="ball__value">1</p>
                            </div>
                        </div>
                        <div class="ball ball--two">
                            <div class="ball__inside-frame">
                                <p class="ball__value">2</p>
                            </div>
                        </div>
                        <div class="ball ball--three">
                            <div class="ball__inside-frame">
                                <p class="ball__value">3</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div class="info-card-wrapper">
                <div class="info-card">
                    <dl class="info-card__list">
                        <div class="info-card__block">
                            <dt class="info-card__name info-card__name--main">Table</dt>
                            <dd class="info-card__value info-card__value--main">#1</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="info-card__name">Size</dt>
                            <dd class="info-card__value">9 ft</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="info-card__name">Cloth</dt>
                            <dd class="info-card__value">Simonis 860</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="info-card__name">Balls</dt>
                            <dd class="info-card__value">1 + Cue Ball</dd>
                        </div>
                    </dl>
                </div>
            </div>
        </div>
    </body>
</html>
