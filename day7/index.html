<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>8Ball by rchrd</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="layout">
            <main class="main">
                <div class="table">
                    <div class="table__frames layers">
                        <div class="frames table__frame-top"></div>
                        <div class="table__frames-center">
                            <div class="frames table__frame-left"></div>
                            <div class="frames table__frame-right"></div>
                        </div>
                        <div class="frames table__frame-bottom"></div>
                    </div>
                    <div class="table__corners layers">
                        <div class="corners one"></div>
                        <div class="corners two"></div>
                        <div class="corners three"></div>
                        <div class="corners four"></div>
                        <div class="corners five"></div>
                        <div class="corners six"></div>
                    </div>
                    <div class="table__cloth layers"></div>
                    <div class="table__holes layers">
                        <div class="holes one"></div>
                        <div class="holes two"></div>
                        <div class="holes three"></div>
                        <div class="holes four"></div>
                        <div class="holes five"></div>
                        <div class="holes six"></div>
                    </div>
                    <div class="table__bumps layers">
                        <div class="bumps one"></div>
                        <div class="bumps two"></div>
                        <div class="bumps three"></div>
                        <div class="bumps four"></div>
                        <div class="bumps five"></div>
                        <div class="bumps six"></div>
                    </div>
                    <div class="layers table__playing-zone">
                        <div class="balls eight-ball">
                            <div class="balls__circle">
                                <p class="balls__value">8</p>
                            </div>
                        </div>
                        <div class="balls cue-ball">
                        </div>
                        <div class="balls one-ball">
                            <div class="balls__circle">
                                <p class="balls__value">1</p>
                            </div>
                        </div>
                        <div class="balls two-ball">
                            <div class="balls__circle">
                                <p class="balls__value">2</p>
                            </div>
                        </div>
                        <div class="balls three-ball">
                            <div class="balls__circle">
                                <p class="balls__value">3</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div class="info-card-wrapper">
                <div class="info-card">
                    <dl class="info-card__list">
                        <div class="info-card__block">
                            <dt class="name name--main">Table</dt>
                            <dd class="value value--main">#1</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="name">Size</dt>
                            <dd class="value">9 ft</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="name">Cloth</dt>
                            <dd class="value">Simonis 860</dd>
                        </div>
                        <div class="info-card__block">
                            <dt class="name">Balls</dt>
                            <dd class="value">1 + Cue Ball</dd>
                        </div>
                    </dl>
                </div>
            </div>
        </div>
    </body>
</html>
